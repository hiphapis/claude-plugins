schema_version: "1.1"
name: reapply-rule-deletion
context:
  scaffold_script: place-files.sh
expected_outcome: |
  v15로 적용됐고 출처 표시가 확인된 리포를 현재 버전으로 올린다. 카탈로그에서 (vN 삭제)로 지운 R-ROLE-10을 「삭제된 룰」 절차로 걷어 낸다. 스킬이 쓴 문장(기존 표시 없는 R-ROLE-10 주석, 리뷰 워커 succeeded 하위 불릿)은 묻지 않고 지운다. 사용자 문장(R-ROLE-10 기존 표시, "워크트리로 진행"이면 세션이 직접 구현)은 글자 그대로 남기고, 남는 ID가 없으므로 주석을 통째로 지운다. 남은 사용자 문장은 R-ROLE-01(오케스트레이터는 직접 편집하지 않음)과 동시에 지킬 수 없으므로 충돌인데, 물을 수 없으므로 미결정(충돌)으로 적용 기록에 남긴다. 지운 룰은 다시 넣지 않고, 바뀌지 않은 룰의 문장(R-ROLE-01, R-ROLE-06, R-ROLE-12)은 건드리지 않으며 리포에 없는 룰을 새로 넣지 않는다. 적용 기록의 버전을 올리고 기존 결정(제외: R-ROLE-09)은 그대로 둔다. 보고서에 지운 문장을 적는다. 실행 전 리포 룰에 커밋 권한이 없으므로 커밋하지 않는다.
