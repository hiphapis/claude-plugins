schema_version: "1.1"
name: reapply-version-bump
context:
  scaffold_script: place-files.sh
expected_outcome: |
  v14로 적용됐고 출처 표시가 확인된 리포를 현재 버전으로 올린다. v14 이후 바뀐 룰 가운데 스킬이 쓴 문장(기존 표시 없는 R-TEST-01, R-ORCA-11)은 묻지 않고 그 자리에서 새 룰에 맞게 고치고, 옛 문장과 새 문장을 함께 남기지 않는다. 사용자 문장(기존 표시가 붙은 R-ISSUE-01)은 고치지 않고, 새 룰과 어긋나는 부분은 물을 수 없으므로 미결정(충돌)으로 남긴다. v14 이후 새로 생긴 R-ROLE-12는 진입 파일 AGENTS.md에 넣는다. 바뀌지 않은 룰은 문장을 건드리지 않고, 리포에 없어도 새로 넣지 않는다. v14 이후 바뀌었는데 리포에 문장이 없는 룰은 처음 적용할 때처럼 판정하므로 누락으로 추가될 수 있다. 적용 기록의 버전을 올리고, 기록된 결정(제외: R-ROLE-09)은 그대로 두며, 미결정(outward) R-ISSUE-08은 미결정으로 남긴다. 실행 전 리포 룰에 커밋 권한이 없으므로 커밋하지 않는다.
